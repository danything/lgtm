# バックアップは VolSync が PVC ごとのスナップショットを取る(danything/gitops の
# deploy/volsync/application.yaml)。DB の SQLite は WAL なので、スナップショットから
# 自分で立ち直る。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-images
  namespace: lgtm
spec:
  # 新しく作るときは VolSync が R2 の最新から中身を埋める(volsync.yaml の lgtm-images-dst)。今ある PVC には効かない
  dataSourceRef:
    {
      apiGroup: volsync.backube,
      kind: ReplicationDestination,
      name: lgtm-images-dst,
    }
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-db
  namespace: lgtm
spec:
  # 新しく作るときは VolSync が R2 の最新から中身を埋める(volsync.yaml の lgtm-db-dst)。今ある PVC には効かない
  dataSourceRef:
    {
      apiGroup: volsync.backube,
      kind: ReplicationDestination,
      name: lgtm-db-dst,
    }
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
