# バックアップは VolSync が PVC ごとのスナップショットを取る(danything/gitops の
# deploy/volsync/application.yaml)。DB の SQLite は WAL なので、スナップショットから
# 自分で立ち直る。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-images
  namespace: lgtm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-db
  namespace: lgtm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
