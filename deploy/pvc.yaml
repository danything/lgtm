apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-images
  namespace: lgtm
  annotations:
    # ファイルとして k8up に取らせる(apps/k8up の Schedule が拾う)。
    # 書き換わっても部分的に古いだけで壊れない類い。
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-db
  namespace: lgtm
  annotations:
    # **DB はファイルとして取らない。** Pod 側の k8up.io/backupcommand が
    # 整合したコピーを標準出力に出しているので、そちらだけで足りる。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
