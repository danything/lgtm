# lgtm の namespace の秘密。
#   lgtm-secrets: hash / github-client-id / github-client-secret(deployment.yaml が env で読む)
#   volsync-<pvc>: VolSync の restic の Secret(danything/gitops の deploy/backup/secrets.sops.yaml と同じ R2 の資格情報とパスワードで、リポジトリだけ PVC ごと)
# 値は SOPS で暗号化してある(../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは管理者の鍵で `sops edit deploy/secrets.sops.yaml` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
