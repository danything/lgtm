# 整形 (`bun fmt`。`package.json` の format・lint から呼ぶ)。書き方は既定のまま、外すものだけ
[fmt]
# import を並べ替える (副作用だけの import は順を変えない)
sortImports = true
ignorePatterns = [
  "static/",
  # docker-publish.yml がイメージのタグを書き換えて ArgoCD が読む
  "deploy/",
  "renovate.json",
  # scripts/build-wasm.sh が出す Emscripten の糊 (手では触らない。隣の .d.ts は手書き)
  "src/lib/lgtm/vendor/lgtm-wasm.js",
]
