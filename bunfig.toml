# 整形 (`bun fmt`。`package.json` の format・lint から呼ぶ)。書き方は既定のまま
[fmt]
# import を並べ替える (副作用だけの import は順を変えない)
sortImports = true
ignorePatterns = [
  # SOPS が書くファイル (sops edit のたびにインデント 4 で書き直す)
  "deploy/*.sops.yaml",
  # scripts/centroids.ts が書く 512 次元のベクトル。1 行で置く
  "src/lib/server/groups/centroids.json",
  "src/lib/server/groups/scene-centroids.json",
  # scripts/tags.ts が書くタグの語彙と 8 bit のベクトル。1 行で置く
  "src/lib/server/groups/tags.json",
]
