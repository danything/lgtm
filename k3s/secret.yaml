# Encrypted against this cluster's sealed-secrets controller, and scoped to
# this namespace and name -- the ciphertext is useless anywhere else, which is
# what makes it safe to commit. Reseal with bootstrap/kubeseal.sh to change a
# value; nothing plaintext ever lands on disk.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lgtm-secrets
  namespace: lgtm
spec:
  encryptedData:
    github-client-id: 
    github-client-secret: 
    hash: 
  template:
    metadata:
      name: lgtm-secrets
      namespace: lgtm
