# Secret lgtm-secrets は Infisical (il.doany.io) が持ち、External Secrets Operator が
# フォルダ /lgtm/lgtm-secrets の中身をそのままキーにして作る。
# 値の変更は Infisical 側で行い、Git には何も入れない (danything/bootstrap の README 参照)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lgtm-secrets
  namespace: lgtm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: lgtm-secrets
  dataFrom:
    - find:
        path: /lgtm/lgtm-secrets
        name:
          regexp: .*
