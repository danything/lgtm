name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # The bump PR only touches deploy/; ignoring it stops a build loop.
    paths-ignore:
      - "deploy/**"
  workflow_dispatch:

# Only the newest commit is worth deploying; older runs raced for the bump branch.
concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Open tabs compare it to spot a rollout.
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys by a self-merging PR that bumps the tag; Argo CD follows main.
      # GITHUB_TOKEN means none of our workflows run on it.
      - name: Open and self-merge PR to update deployment image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="bump-lgtm-image"
          # From main as it is now: a branch from this run's commit conflicts
          # once another bump has landed.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          sed -i "s#image: ${REGISTRY}/[^:[:space:]]*/lgtm:[^[:space:]]*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" deploy/deployment.yaml
          if git diff --quiet -- deploy/deployment.yaml; then
            echo "deploy/deployment.yaml already points at ${GITHUB_SHA}; nothing to deploy"
            exit 0
          fi
          git add deploy/deployment.yaml
          git commit -m "chore: update lgtm image to ${GITHUB_SHA}"
          git push --force origin "$branch"
          title="chore: update lgtm image to ${GITHUB_SHA::7}"
          body="Automated image tag bump for commit ${GITHUB_SHA}. Merges itself."
          gh pr create --base main --head "$branch" --title "$title" --body "$body" \
            || gh pr edit "$branch" --title "$title" --body "$body"

          # Squash is the only method allowed; --auto in case main requires checks.
          gh pr merge "$branch" --squash || gh pr merge "$branch" --auto --squash
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
