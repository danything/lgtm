name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # Merging the bot's own image-bump PR only touches deploy/, so ignoring it
    # here stops the build -> bump PR -> merge -> build loop.
    paths-ignore:
      - 'deploy/**'
  workflow_dispatch:

# Merging several PRs at once used to start a run per merge, and they all raced
# for the one bump branch: the first to finish moved main, the rest were left
# proposing a bump from a base that no longer existed, and the newest build --
# the only one anybody wanted deployed -- lost. Only the newest commit is worth
# deploying, so supersede the older runs instead of racing them.
concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Baked into version.json so tabs opened before a rollout can tell
          # they are running an older build.
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy goes through a PR that bumps the image tag and merges itself;
      # ArgoCD deploys whatever deploy/ says on main. The PR is opened with
      # GITHUB_TOKEN, so no workflow of ours runs on it (docker-build-check.yml
      # and claude-code-review.yml skip deploy/deployment.yaml-only changes).
      #
      # This step used to post a "build" status on the PR as well, back when
      # main required that check and nothing else could report it. The ruleset
      # no longer requires any check, so the PR merges without one.
      - name: Open and self-merge PR to update deployment image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="bump-lgtm-image"
          # Build the bump on top of main as it stands now, not on the commit
          # this run was triggered by. Those differ whenever an earlier bump has
          # landed in between, and a branch cut from the older point proposes a
          # change to a line that has since moved, which GitHub reports as a
          # conflict and no one can merge.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          sed -i "s#image: ${REGISTRY}/[^:[:space:]]*/lgtm:[^[:space:]]*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" deploy/deployment.yaml
          if git diff --quiet -- deploy/deployment.yaml; then
            echo "deploy/deployment.yaml already points at ${GITHUB_SHA}; nothing to deploy"
            exit 0
          fi
          git add deploy/deployment.yaml
          git commit -m "chore: update lgtm image to ${GITHUB_SHA}"
          git push --force origin "$branch"
          title="chore: update lgtm image to ${GITHUB_SHA::7}"
          body="Automated image tag bump for commit ${GITHUB_SHA}. Merges itself."
          gh pr create --base main --head "$branch" --title "$title" --body "$body" \
            || gh pr edit "$branch" --title "$title" --body "$body"

          # Squash is the only method this repository allows; --merge fails
          # outright with "Merge commits are not allowed on this repository",
          # which took the whole job down with it.
          #
          # Auto-merge is the fallback should main ever require something again:
          # the PR then merges as soon as that is satisfied.
          gh pr merge "$branch" --squash || gh pr merge "$branch" --auto --squash
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
