name: Docker Build Check

on:
  pull_request:
    branches: [main]
    # Nothing under deploy/ goes into the image (.dockerignore drops it), so a
    # PR that only touches it has nothing to build. This is also what keeps the
    # image-tag PRs from docker-publish.yml out: they are opened with
    # GITHUB_TOKEN, and GitHub records each pull_request workflow for them as a
    # run that fails at once ("workflow file issue") -- the job-level if below
    # never gets to decide anything. Filtering on paths stops the run existing.
    paths-ignore:
      - "deploy/**"
  # main too, so a change that got past the PR check still shows up red.
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"

jobs:
  # Builds the image, then runs it and converts a PNG and a GIF in Chromium with
  # the wasm it was built with (tests/wasm.spec.ts). A building image is not
  # enough: an emsdk update merges itself once this passes, and one that still
  # compiles can make a wasm that fails in the browser.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Safety net for an image-tag PR opened by someone else; see paths-ignore.
    if: github.head_ref != 'bump-lgtm-image'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lgtm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the app
        run: docker run -d --name app -p 3000:3000 lgtm:ci

      - uses: oven-sh/setup-bun@v2

      # Only @playwright/test is needed here, but the lockfile pins it, so the
      # browser installed matches it.
      - run: bun i --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - name: Convert images in the browser
        run: |
          timeout 30 sh -c 'until curl -sf -o /dev/null http://localhost:3000/; do sleep 1; done'
          bunx playwright test

      - name: App logs
        if: failure()
        run: docker logs app
