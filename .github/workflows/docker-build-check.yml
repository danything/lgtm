name: Docker Build Check

on:
  pull_request:
    branches: [main]
    # deploy/ is not in the image. This also keeps out the image-tag PRs, which
    # GITHUB_TOKEN opens and GitHub would record as failed runs.
    paths-ignore:
      - "deploy/**"
  # main too, so a change that got past the PR check still shows up red.
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.head_ref != 'bump-lgtm-image'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      # The model and the server's WebP reader, as scripts/build-wasm.sh puts
      # them, so infer.test.ts also runs CLIP (it skips without them). From the
      # build job's cache; this job only reads it.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: wasm-out
          outputs: type=local,dest=/tmp/wasm
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: model
          outputs: type=local,dest=model
          cache-from: type=gha
      - run: cp /tmp/wasm/* src/lib/lgtm/vendor/ && cp /tmp/wasm/webp-node.wasm model/
      - run: bun run test

  # Converts a PNG and a GIF in Chromium with the built wasm: an emsdk update
  # can still compile and yet make a wasm that fails in the browser.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Safety net for an image-tag PR opened by someone else; see paths-ignore.
    if: github.head_ref != 'bump-lgtm-image'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lgtm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # As the image's own user: a root-only model file once left grouping off.
      # Through the bundled embed() and the worker it starts, so a build that
      # leaves the worker out fails here.
      - name: Run the grouping model in its worker
        run: >-
          docker run --rm -v "$PWD/tests/fixtures:/fixtures:ro" lgtm:ci -e "
          const fs = require('fs');
          const dir = '/usr/src/app/build/server/chunks';
          const chunk = fs.readdirSync(dir).find((f) => f.endsWith('.js') &&
            fs.readFileSync(dir + '/' + f, 'utf8').includes('clip.worker.js'));
          const { embed } = await import(dir + '/' + chunk);
          const e = await embed(fs.readFileSync('/fixtures/frames-96x64.webp'));
          if (e.length !== 512) throw new Error('got ' + e.length);
          process.exit(0)"

      - name: Start the app
        run: docker run -d --name app -p 3000:3000 lgtm:ci

      - uses: oven-sh/setup-bun@v2

      # The lockfile pins @playwright/test, so the browser matches it.
      - run: bun i --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - name: Convert images in the browser
        run: |
          timeout 30 sh -c 'until curl -sf -o /dev/null http://localhost:3000/; do sleep 1; done'
          bunx playwright test

      - name: App logs
        if: failure()
        run: docker logs app
