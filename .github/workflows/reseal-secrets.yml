name: Reseal secrets

# 平文の値は GitHub Secrets 側にだけ置く。sealed-secrets コントローラーの公開鍵
# (非秘密) は org の Actions variable `SEALED_SECRETS_PUB_CERT` に置いていて、
# それで kubeseal し、結果の SealedSecret だけをコミットする。値を変えたら
# Secrets を更新してこのワークフローを再実行する。鍵のローテーションは
# bootstrap/fetch-cert.sh 参照（org変数の更新もそちらで行う）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal lgtm-secrets
        env:
          SEAL_DATA: |
            {
              "github-client-id": ${{ toJSON(secrets.GH_CLIENT_ID) }},
              "github-client-secret": ${{ toJSON(secrets.GH_CLIENT_SECRET) }},
              "hash": ${{ toJSON(secrets.HASH) }}
            }
          PUB_CERT: ${{ vars.SEALED_SECRETS_PUB_CERT }}
        run: |
          set -eu
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          if ! command -v kubeseal >/dev/null 2>&1; then
            curl -sfL -o "$WORKDIR/kubeseal.tar.gz" \
              "https://github.com/bitnami/sealed-secrets/releases/download/v0.38.4/kubeseal-0.38.4-linux-amd64.tar.gz"
            tar -xzf "$WORKDIR/kubeseal.tar.gz" -C "$WORKDIR" kubeseal
            sudo install -m 0755 "$WORKDIR/kubeseal" /usr/local/bin/kubeseal
          fi

          printf '%s' "$PUB_CERT" > /tmp/pub-cert.pem

          python3 - "$WORKDIR/plain.yaml" <<'PYEOF'
          import base64, json, os, sys
          data = json.loads(os.environ["SEAL_DATA"])
          with open(sys.argv[1], "w") as f:
              f.write("apiVersion: v1\nkind: Secret\nmetadata:\n")
              f.write("  name: lgtm-secrets\n  namespace: lgtm\n")
              f.write("type: Opaque\ndata:\n")
              for key, value in data.items():
                  b64 = base64.b64encode(value.encode()).decode()
                  f.write(f"  {json.dumps(key)}: {b64}\n")
          PYEOF

          kubeseal --cert /tmp/pub-cert.pem --format yaml \
            < "$WORKDIR/plain.yaml" > k3s/secret.yaml

      - name: Commit and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/secret.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: reseal lgtm-secrets"
          git push
